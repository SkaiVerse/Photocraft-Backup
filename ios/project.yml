name: PhotoCraft
options:
  deploymentTarget:
    iOS: "18.4"
targets:
  PhotoCraft:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinfor.photocraft
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "__BUILD__"
        SWIFT_OBJC_BRIDGING_HEADER: App/PhotoCraft-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/rust-lib"
        OTHER_LDFLAGS: "-lphotocraft_ios $(NATIVE_LIBS)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhotoCraft
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "__BUILD__"
        UILaunchScreen: {}
        # The display link may run at the panel's full rate (120 Hz on ProMotion) instead of
        # being floored at one frame per 60 Hz, so the Pencil keeps up with the ink.
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        NSPhotoLibraryAddUsageDescription: PhotoCraft saves the pictures you export to your Photos library.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - com.adobe.photoshop-image
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
